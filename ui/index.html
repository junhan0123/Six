<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>小6 · 个人 AI OS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/gfe-dashboard.css" />
</head>
<body>

<div class="app">

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar">

    <div class="brand-row">
      <span class="brand-name">小<b>6</b></span><span class="brand-heart" title="小6">❤</span>
      <span class="live-dot" id="liveDot" title="服务连接状态"></span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        首页
      </button>
      <button class="nav-item" data-view="chat">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        对话
      </button>
      <button class="nav-item" data-view="tasks">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>
        ⚡ 工作
      </button>
      <button class="nav-item" data-view="knowledge">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h10"/></svg></span>
        知识库
      </button>
      <button class="nav-item" data-view="memory">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 1 1-3 3"/><path d="M6 10v3a6 6 0 0 0 12 0v-3"/><path d="M9 7v6"/><path d="M15 7v3"/></svg></span>
        记忆
      </button>
      <button class="nav-item" data-view="capabilities">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 1 0 5.66 5.66l-9.9 9.9-4.24 1.41 1.41-4.24 9.9-9.9z"/></svg></span>
        能力中心
      </button>
      <button class="nav-item" data-view="gfe">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
        全球洞察
      </button>
    </nav>

    <div class="divider"></div>
    <div class="section-label">💬 最近对话</div>
    <div class="recent" id="recentList">
      <div class="mini-loading"><span class="spinner"></span>加载中</div>
    </div>

    <div class="spacer"></div>

    <div class="user-card">
      <span class="user-avatar">6</span>
      <span class="user-name">我的小6</span>
      <div class="user-actions">
        <button class="user-action-btn" data-view="settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.4 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.4l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <span class="user-pro" id="modelBadge">—</span>
      </div>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main class="main">

    <!-- ---------- 首页 Dashboard ---------- -->
    <section class="view active" id="view-dashboard">
      <div class="page">
        <div class="page-head">
          <h1>你好，我是<span class="brand-text">小6</span> <span class="brand-heart">❤</span></h1>
          <button class="customize-btn" data-act="reload-dashboard">刷新</button>
        </div>
        <div class="dash-grid" id="dashGrid">
          <div class="mini-loading full-width"><span class="spinner"></span>正在为你准备今日信息…</div>
        </div>
      </div>

      <!-- ---------- 全局 Command Bar ---------- -->
      <div class="dashboard-command-wrap">
        <div class="dashboard-command">
          <div class="command-bar" id="commandBar">
            <span class="command-sparkle">✦</span>
            <input type="text" id="commandInput" placeholder="让小6帮我……" autocomplete="off" />
            <button class="round-btn command-voice" id="commandVoice" title="语音输入">🎙</button>
            <button class="command-send" id="commandSend" title="发送">↑</button>
          </div>
          <div class="command-hints">
            <span>试试：</span>
            <button data-cmd="帮我总结今天热点">总结热点</button>
            <button data-cmd="帮我创建一个任务">创建任务</button>
            <button data-cmd="查询我的记忆">查询记忆</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- 对话 ---------- -->
    <section class="view" id="view-chat">
      <div class="agent-activity idle" id="agentActivity" title="小6 的工作状态">
        <div class="aa-side"><span class="aa-pulse"></span></div>
        <div class="aa-main">
          <div class="aa-title" id="aaTitle">小6已就绪</div>
          <div class="aa-steps" id="aaSteps"></div>
        </div>
      </div>
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">
          <div class="ce-greeting">有什么可以帮你的？</div>
          <div class="ce-sub">我是小6，可以查信息、管任务、读文件、操作电脑，也能陪你聊天。</div>
          <div class="quick" id="quickChips"></div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="告诉小6你想做什么…"></textarea>
          <div class="composer-toolbar">
            <button class="round-btn" id="btnAttach" title="添加文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="spacer-h"></div>
            <button class="round-btn" id="btnVoice" title="语音输入">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4M8 22h8"/></svg>
            </button>
            <button class="send-btn" id="btnSend" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 是否联网由小6自动判断</div>
      </div>
    </section>

    <!-- ---------- 任务中心 ---------- -->
    <section class="view" id="view-tasks">
      <div class="page">
        <div class="page-head">
          <h1>工作中心</h1>
          <button class="customize-btn" data-act="reload-tasks">刷新</button>
        </div>
        <div class="tabs" id="taskTabs">
          <button class="tab active" data-tab="current">当前任务</button>
          <button class="tab" data-tab="history">历史任务</button>
          <button class="tab" data-tab="recent">最近工作</button>
          <button class="tab" data-tab="trace">执行过程</button>
          <button class="tab" data-tab="execution">执行观测</button>
        </div>
        <div id="tasksBody"><div class="mini-loading"><span class="spinner"></span>加载中…</div></div>

        <!-- Execution Timeline Modal -->
        <div id="execution-timeline" class="timeline-modal" style="display:none;">
          <div class="timeline-content">
            <div class="timeline-loading"><span class="spinner"></span>加载中…</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- 知识库 ---------- -->
    <section class="view" id="view-knowledge">
      <div class="page">
        <div class="page-head"><h1>知识库</h1><button class="customize-btn" data-act="reload-knowledge">刷新</button></div>
        <div id="knowledgeBody"><div class="mini-loading"><span class="spinner"></span>读取知识库…</div></div>
      </div>
    </section>

    <!-- ---------- 记忆 (Obsidian 三栏布局) ---------- -->
    <section class="view" id="view-memory">
      <div class="page memory-layout">
        <div class="page-head">
          <h1>记忆</h1>
          <div class="head-actions">
            <button class="customize-btn" id="btnCleanLegacy">清理历史数据</button>
            <button class="customize-btn" data-act="reload-memory">刷新</button>
          </div>
        </div>
        <div class="search-bar">
          <input id="memSearch" type="text" placeholder="搜索记忆与笔记…" />
          <button class="customize-btn" id="btnMemSearch">搜索</button>
        </div>
        <div class="memory-panes">
          <!-- 左：Markdown 文件树 -->
          <div class="memory-pane memory-tree" id="memoryTree">
            <div class="pane-header">
              <span>文件</span>
              <button class="mini-btn" id="btnNewNote" title="新建笔记">+ 新建</button>
            </div>
            <div id="treeBody"><div class="mini-loading"><span class="spinner"></span></div></div>
          </div>
          <!-- 中：Markdown 编辑器 -->
          <div class="memory-pane memory-editor" id="memoryEditor">
            <div class="pane-header">
              <span id="editorTitle">选择一篇笔记</span>
              <div class="pane-actions">
                <button class="mini-btn" id="btnRenameNote" title="重命名">重命名</button>
                <button class="mini-btn" id="btnSaveNote" title="保存">保存</button>
                <button class="mini-btn danger" id="btnDeleteNote" title="删除">删除</button>
              </div>
            </div>
            <textarea class="markdown-editor" id="markdownEditor" placeholder="选择左侧的笔记开始查看，或点击「+ 新建」写一篇新的 Markdown 笔记…"></textarea>
          </div>
          <!-- 右：知识关系图 -->
          <div class="memory-pane memory-graph" id="memoryGraph">
            <div class="pane-header">
              <span>知识关系</span>
              <span class="pane-hint" id="graphHint"></span>
            </div>
            <div id="graphBody"><div class="mini-loading"><span class="spinner"></span></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- 能力中心 ---------- -->
    <section class="view" id="view-capabilities">
      <div class="page">
        <div class="page-head"><h1>能力中心</h1><button class="customize-btn" data-act="reload-capabilities">刷新</button></div>
        <div class="cap-filters" id="capFilters"></div>
        <div id="capabilitiesBody"><div class="mini-loading"><span class="spinner"></span>加载中…</div></div>
      </div>
    </section>

    <!-- ---------- 设置 ---------- -->
    <section class="view" id="view-settings">
      <div class="page">
        <div class="page-head"><h1>设置</h1></div>
        <div class="settings-nav" id="settingsNav">
          <button class="settings-tab active" data-setct="general">通用</button>
          <button class="settings-tab" data-setct="models">模型中心</button>
          <button class="settings-tab" data-setct="network">联网策略</button>
          <button class="settings-tab" data-setct="diagnostics">服务状态</button>
        </div>
        <div id="settingsBody"><div class="mini-loading"><span class="spinner"></span>加载中…</div></div>
      </div>
    </section>

    <!-- ---------- 全球洞察 GFE Dashboard ---------- -->
    <section class="view" id="view-gfe">
      <div class="page">
        <div class="page-head">
          <h1>全球洞察 <span class="brand-heart">🌍</span></h1>
          <button class="customize-btn" data-act="refresh-gfe">刷新</button>
        </div>
        <div class="gfe-dashboard" id="gfeDashboard">
          <div class="gfe-loading"><span class="spinner"></span>加载中…</div>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileInput" hidden multiple />

<!-- 任务详情弹窗（前端展示，无新增 API） -->
<div id="taskDetailModal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tdTitle">
    <div class="modal-head">
      <h3 id="tdTitle">任务详情</h3>
      <button class="modal-close" data-act="close-task-modal" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="tdBody"></div>
  </div>
</div>

<script src="js/work_health.js"></script>
<script src="js/work_filters.js"></script>
<script src="js/gfe-dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
