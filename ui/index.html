<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>小6 (Six)</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar">

    <div class="brand-row">
      <span class="brand-name">小<b>6</b> (Six)</span>
      <span class="live-dot" id="liveDot" title="后端连接状态"></span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="chat">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        对话
      </button>
      <button class="nav-item" data-view="tasks">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>
        任务
      </button>
      <button class="nav-item" data-view="knowledge">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h10"/></svg></span>
        知识库
      </button>
      <button class="nav-item" data-view="memory">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 1 1-3 3"/><path d="M6 10v3a6 6 0 0 0 12 0v-3"/><path d="M9 7v6"/><path d="M15 7v3"/></svg></span>
        记忆
      </button>
      <button class="nav-item" data-view="tools">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 1 0 5.66 5.66l-9.9 9.9-4.24 1.41 1.41-4.24 9.9-9.9z"/></svg></span>
        工具
      </button>
      <button class="nav-item" data-view="agents">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M14.5 18a4 4 0 0 1 6.5-1"/></svg></span>
        智能体
      </button>
      <button class="nav-item" data-view="settings">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.4 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.4l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
        设置
      </button>
    </nav>

    <div class="divider"></div>
    <div class="section-label">最近对话</div>
    <div class="recent" id="recentList">
      <div class="mini-loading"><span class="spinner"></span>加载中</div>
    </div>

    <div class="spacer"></div>

    <div class="user-card">
      <span class="user-avatar">S</span>
      <span class="user-name">Six 用户</span>
      <span class="user-pro" id="toolBadge">—</span>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main class="main">

    <!-- ---------- 对话 ---------- -->
    <section class="view active" id="view-chat">
      <div class="chat-scroll" id="chatScroll">

        <!-- 空状态 / 首页 -->
        <div class="hero" id="hero">
          <div class="greeting">你好，我是<span class="name">小6</span></div>
          <div class="sub-greeting" id="heroSub">你的专属 AI 助手，随时为你服务</div>

          <!-- 主动推送（/api/stream 真实事件：简报 / 舆情告警 / 提醒） -->
          <div class="proactive-feed" id="proactiveFeed"></div>

          <div class="quick" id="quickChips"></div>

          <div class="hero-extra">
            <!-- 今日简报（真实 /api/briefing + /api/weather + /api/hotspots） -->
            <div class="section-head">
              <div class="section-title">今日简报</div>
              <button class="customize-btn" data-act="reload-briefing">刷新</button>
            </div>
            <div id="briefingBox">
              <div class="mini-loading"><span class="spinner"></span>读取简报…</div>
            </div>

            <div class="section-head" style="margin-top:26px">
              <div class="section-title">小6 的能力</div>
              <button class="customize-btn" data-view="tools">全部能力</button>
            </div>
            <div class="abilities" id="abilityGrid">
              <div class="mini-loading"><span class="spinner"></span>读取真实能力…</div>
            </div>

            <div class="section-head" style="margin-top:26px">
              <div class="section-title">进行中的任务</div>
              <button class="customize-btn" data-view="tasks">全部任务</button>
            </div>
            <div id="taskPreview">
              <div class="mini-loading"><span class="spinner"></span>读取任务…</div>
            </div>
          </div>
        </div>

        <!-- 消息流 -->
        <div class="messages" id="messages"></div>
      </div>

      <!-- 输入框 -->
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="告诉小6你想做什么…"></textarea>
          <div class="composer-toolbar">
            <button class="round-btn" id="btnAttach" title="上传文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="pill-btn" id="btnSearch" title="启用联网搜索">
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
              联网搜索
            </button>
            <button class="pill-btn" id="btnThink" title="深度思考">
              <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 1 4 12.7c-.6.5-1 1.3-1 2.1V18H9v-1.2c0-.8-.4-1.6-1-2.1A7 7 0 0 1 12 2z"/></svg></span>
              深度思考
            </button>
            <div class="spacer-h"></div>
            <button class="round-btn" id="btnVoice" title="语音输入">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4M8 22h8"/></svg>
            </button>
            <button class="send-btn" id="btnSend" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 内容直达小6后端（同源 127.0.0.1:8000）</div>
      </div>
    </section>

    <!-- ---------- 任务 ---------- -->
    <section class="view" id="view-tasks">
      <div class="page">
        <div class="page-head"><h1>任务</h1><button class="customize-btn" data-act="reload-tasks">刷新</button></div>
        <div id="tasksBody"><div class="mini-loading"><span class="spinner"></span>读取真实任务…</div></div>
        <div class="page-head" style="margin-top:30px"><h1>目标</h1></div>
        <div id="goalsBody"><div class="mini-loading"><span class="spinner"></span>读取目标…</div></div>
      </div>
    </section>

    <!-- ---------- 知识库 ---------- -->
    <section class="view" id="view-knowledge">
      <div class="page">
        <div class="page-head"><h1>知识库</h1><button class="customize-btn" data-act="reload-knowledge">刷新</button></div>
        <div id="knowledgeBody"><div class="mini-loading"><span class="spinner"></span>读取知识库…</div></div>
      </div>
    </section>

    <!-- ---------- 记忆 ---------- -->
    <section class="view" id="view-memory">
      <div class="page">
        <div class="page-head"><h1>记忆</h1><button class="customize-btn" data-act="reload-memory">刷新</button></div>
        <div class="search-bar">
          <input id="memSearch" type="text" placeholder="搜索记忆…" />
          <button class="customize-btn" id="btnMemSearch">搜索</button>
        </div>
        <div id="memoryBody"><div class="mini-loading"><span class="spinner"></span>读取记忆…</div></div>
      </div>
    </section>

    <!-- ---------- 工具 ---------- -->
    <section class="view" id="view-tools">
      <div class="page">
        <div class="page-head"><h1>工具</h1><button class="customize-btn" data-act="reload-tools">刷新</button></div>
        <div class="toolbar">
          <input id="toolSearch" type="text" placeholder="筛选 62 个已挂载工具…" />
          <span class="count" id="toolCount">—</span>
        </div>
        <div id="toolsBody"><div class="mini-loading"><span class="spinner"></span>读取真实工具…</div></div>
      </div>
    </section>

    <!-- ---------- 智能体 ---------- -->
    <section class="view" id="view-agents">
      <div class="page">
        <div class="page-head"><h1>智能体</h1><button class="customize-btn" data-act="reload-agents">刷新</button></div>
        <div id="agentsBody"><div class="mini-loading"><span class="spinner"></span>读取 Agent 状态…</div></div>
      </div>
    </section>

    <!-- ---------- 设置 ---------- -->
    <section class="view" id="view-settings">
      <div class="page">
        <div class="page-head"><h1>设置</h1><button class="customize-btn" data-act="reload-settings">刷新</button></div>
        <div id="settingsBody"><div class="mini-loading"><span class="spinner"></span>读取配置…</div></div>
      </div>
    </section>

  </main>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileInput" hidden multiple />

<script src="js/app.js"></script>
</body>
</html>
