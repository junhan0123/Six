<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小6 · Agent</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/workspace.css" />
<style>
/* Inline overrides for specific components */
.x6-nav-btn.is-active { background: var(--x6-brand-light); color: var(--x6-brand); }
.x6-composer-send { background: var(--x6-brand); }
.x6-composer-send:hover { background: var(--x6-brand-hover); }
.x6-model-sel-select { border-color: var(--x6-border); color: var(--x6-text-secondary); font-size: 12px; padding: 4px 8px; border-radius: var(--x6-radius-sm); background: var(--x6-surface); }
</style>
</head>
<body>

<!-- ═══ Top Menu Bar (native desktop style) ═══ -->
<div class="x6-menubar">
  <div class="x6-menubar-logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--x6-brand)" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="var(--x6-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>小6</span>
  </div>
  <div class="x6-menubar-items">
    <button class="x6-menubar-btn" data-menu="file">文件</button>
    <button class="x6-menubar-btn" data-menu="edit">编辑</button>
    <button class="x6-menubar-btn" data-menu="view">视图</button>
    <button class="x6-menubar-btn" data-menu="help">帮助</button>
  </div>
  <div class="x6-menubar-actions">
    <button class="x6-menubar-search" title="搜索" onclick="window.Xiao6&&window.Xiao6.palette&&window.Xiao6.palette.openPalette()">⌘K</button>
    <button class="x6-menubar-layout" title="折叠侧边栏" id="toggleSidebar">⊞</button>
  </div>
</div>

<!-- ═══ Dropdown Menus ═══ -->
<div class="x6-menu-dropdown" id="menu-file" hidden>
  <div class="x6-menu-item" data-action="new-chat"><span>新建聊天</span><span class="x6-menu-key">Ctrl+T</span></div>
  <div class="x6-menu-sep"></div>
  <div class="x6-menu-item" data-action="settings"><span>设置</span><span class="x6-menu-key">Ctrl+,</span></div>
  <div class="x6-menu-sep"></div>
  <div class="x6-menu-item" data-action="focus-app"><span>聚焦小6窗口</span><span class="x6-menu-key">Ctrl+Alt+G</span></div>
  <div class="x6-menu-sep"></div>
  <div class="x6-menu-item" data-action="quit"><span>退出</span><span class="x6-menu-key">Ctrl+Q</span></div>
</div>

<div class="x6-menu-dropdown" id="menu-edit" hidden>
  <div class="x6-menu-item" data-action="smart-mode"><span>智能模式</span></div>
  <div class="x6-menu-item" data-action="expert-mode"><span>专家模式</span></div>
  <div class="x6-menu-sep"></div>
  <div class="x6-menu-item"><span>撤销</span><span class="x6-menu-key">Ctrl+Z</span></div>
  <div class="x6-menu-item"><span>重做</span><span class="x6-menu-key">Ctrl+Y</span></div>
  <div class="x6-menu-sep"></div>
  <div class="x6-menu-item" data-action="toggle-palette"><span>命令面板</span><span class="x6-menu-key">Ctrl+K</span></div>
</div>

<div class="x6-menu-dropdown" id="menu-view" hidden>
  <div class="x6-menu-item" data-action="toggle-sidebar"><span>切换导航栏</span><span class="x6-menu-key">Ctrl+B</span></div>
</div>

<div class="x6-menu-dropdown" id="menu-help" hidden>
  <div class="x6-menu-item" data-action="about"><span>关于小6</span></div>
  <div class="x6-menu-item" data-action="help"><span>使用帮助</span></div>
</div>

<!-- ═══ App Container ═══ -->
<div class="x6-app" id="app">

  <!-- ═══ Sidebar ═══ -->
  <aside class="x6-sidebar" id="sidebar">
    <!-- Brand -->
    <div class="x6-sidebar-brand">
      <div class="x6-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--x6-brand)" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="var(--x6-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="x6-logo-text">小6</span>
      </div>
    </div>

    <!-- New Chat Button -->
    <button class="x6-new-chat-btn" id="newChatBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>新对话</span>
    </button>

    <!-- Nav -->
    <nav class="x6-sidebar-nav">
      <button class="x6-nav-btn is-active" data-nav="home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>对话</span>
      </button>
      <button class="x6-nav-btn" data-nav="projects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>项目</span>
      </button>
      <button class="x6-nav-btn" data-nav="tasks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>任务</span>
      </button>
      <button class="x6-nav-btn" data-nav="knowledge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>知识</span>
      </button>
      <button class="x6-nav-btn" data-nav="memory">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>记忆</span>
      </button>
      <button class="x6-nav-btn" data-nav="tools">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>工具</span>
      </button>
    </nav>

    <!-- User -->
    <div class="x6-sidebar-footer">
      <div class="x6-user-info">
        <div class="x6-avatar" id="userAvatar">6</div>
        <div class="x6-user-meta">
          <div class="x6-username" id="userName">用户</div>
          <div class="x6-plan">免费版</div>
        </div>
      </div>
      <button class="x6-settings-btn" id="settingsBtn" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ═══ Main Shell ═══ -->
  <div class="x6-shell" id="shell">
    <!-- Views -->
    <main class="x6-main">
      <!-- HOME view -->
      <section class="x6-view x6-view-home" data-view="home">
        <div class="x6-hero">
          <div class="x6-hero-inner">
            <h1 class="x6-hero-title" id="heroTitle">今天想做什么？</h1>

            <!-- Composer -->
            <div class="x6-composer-wrap" id="composerWrap">
              <div class="x6-composer-input-wrap">
                <textarea class="x6-composer-input" id="cmdInput" rows="1" placeholder="告诉小6你想完成什么…"></textarea>
              </div>
              <div class="x6-composer-bar">
                <div class="x6-composer-left">
                  <button class="x6-composer-attach" title="附件" id="attachBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  </button>
                  <button class="x6-composer-mode" id="modeSel" title="切换模式">智能模式</button>
                </div>
                <div class="x6-composer-right">
                  <button class="x6-composer-voice" id="voiceBtn" title="语音输入">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                  </button>
                  <button class="x6-composer-send" id="sendBtn" title="发送">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Timeline -->
            <div class="x6-timeline-section" id="timelineSection" style="display:none">
              <div class="x6-timeline-header">
                <span>执行过程</span>
                <button class="x6-timeline-toggle" id="inspTrigger">展开详情 ▸</button>
              </div>
              <div class="x6-timeline-body" id="timelineBody"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- PROJECTS view -->
      <section class="x6-view" data-view="projects" hidden>
        <div class="x6-list-page" id="projectList">
          <div class="x6-list-header">
            <h2>项目</h2>
            <span class="x6-list-count" id="projectCount">0</span>
          </div>
          <div class="x6-list-empty">暂无项目</div>
        </div>
      </section>

      <!-- TASKS view -->
      <section class="x6-view" data-view="tasks" hidden>
        <div class="x6-list-page" id="tasksList">
          <div class="x6-list-header">
            <h2>任务</h2>
          </div>
          <div class="x6-list-empty">暂无任务</div>
        </div>
      </section>

      <!-- KNOWLEDGE view -->
      <section class="x6-view" data-view="knowledge" hidden>
        <div class="x6-list-page" id="knowledgeList">
          <div class="x6-list-header">
            <h2>知识</h2>
          </div>
          <div class="x6-list-empty">知识库为空</div>
        </div>
      </section>

      <!-- MEMORY view -->
      <section class="x6-view" data-view="memory" hidden>
        <div class="x6-list-page" id="memoryList">
          <div class="x6-list-header">
            <h2>记忆</h2>
          </div>
          <div class="x6-list-empty">暂无记忆</div>
        </div>
      </section>

      <!-- TOOLS view -->
      <section class="x6-view" data-view="tools" hidden>
        <div class="x6-list-page" id="toolsList">
          <div class="x6-list-header">
            <h2>工具</h2>
          </div>
          <div class="x6-list-empty">加载中…</div>
        </div>
      </section>

      <!-- HISTORY view -->
      <section class="x6-view" data-view="history" hidden>
        <div class="x6-list-page" id="historyList">
          <div class="x6-list-header">
            <h2>历史对话</h2>
          </div>
          <div class="x6-list-empty">暂无对话</div>
        </div>
      </section>

      <!-- SETTINGS view -->
      <section class="x6-view" data-view="settings" hidden>
        <div class="x6-settings-layout">
          <div class="x6-settings-sidebar">
            <button class="x6-settings-back" id="settingsBack">← 返回</button>
            <div class="x6-settings-nav">
              <button class="x6-settings-nav-btn is-active" data-settings="general">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>常规</span>
              </button>
              <button class="x6-settings-nav-btn" data-settings="models">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>模型</span>
              </button>
              <button class="x6-settings-nav-btn" data-settings="voice">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <span>语音</span>
              </button>
              <button class="x6-settings-nav-btn" data-settings="data">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>数据</span>
              </button>
            </div>
          </div>
          <div class="x6-settings-content" id="settingsContent">
            <!-- Dynamic content -->
          </div>
        </div>
      </section>
    </main>

    <!-- Now bar -->
    <div class="x6-nowbar" id="nowBar" data-state="idle">
      <div class="x6-nowbar-content">
        <span class="x6-nowbar-dot"></span>
        <span class="x6-nowbar-text" id="nowText">小6在线</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Drawer (inspector) ═══ -->
<div class="x6-drawer-backdrop" id="drawerScrim" aria-hidden="true"></div>
<aside class="x6-drawer" id="drawer" aria-hidden="true">
  <div class="x6-drawer-header">
    <span class="x6-drawer-title" id="drawerTitle">详情</span>
    <button class="x6-drawer-close" id="drawerClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="x6-drawer-body" id="drawerBody"></div>
</aside>

<!-- ═══ Command Palette ═══ -->
<div class="x6-palette-backdrop" id="paletteScrim" aria-hidden="true"></div>
<div class="x6-palette" id="palette" aria-hidden="true">
  <div class="x6-palette-input-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="x6-palette-input" id="paletteInput" placeholder="搜索命令或对话……" autocomplete="off" />
  </div>
  <div class="x6-palette-list" id="paletteList"></div>
</div>

<!-- ═══ Overlay (modal) ═══ -->
<div class="x6-overlay" id="overlay" aria-hidden="true">
  <div class="x6-overlay-card">
    <div class="x6-overlay-header">
      <span class="x6-overlay-title" id="overlayTitle">提示</span>
      <button class="x6-overlay-close" onclick="window.Xiao6&&window.Xiao6.main&&window.Xiao6.main.closeOverlay()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="x6-overlay-body" id="overlayBody"></div>
  </div>
</div>

<!-- ═══ Toasts ═══ -->
<div class="x6-toast-layer" id="toastLayer"></div>

<!-- ═══ Voice orb ═══ -->
<div class="x6-voice-orb" id="orbBtn">
  <div class="x6-orb-presence" id="orbPresence" data-state="idle"></div>
  <div class="x6-mini-orb" data-state="idle"></div>
</div>

<!-- ═══ Scripts ═══ -->
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/timeline.js"></script>
<script src="js/approval.js"></script>
<script src="js/voice.js"></script>
<script src="js/palette.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/inspector.js"></script>
<script src="js/main.js"></script>
</body>
</html>
