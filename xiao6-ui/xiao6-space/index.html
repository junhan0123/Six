<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小6 · Agent</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/workspace.css" />
<link rel="stylesheet" href="css/panel.css" />
<style>
/* AgnesCode-style accent: indigo (#6366F1) instead of flat gray */
:root {
  --x6-brand: #6366F1;
  --x6-brand-hover: #4F46E5;
  --x6-brand-light: #EEF2FF;
}
.x6-nav-btn.is-active { background: var(--x6-brand-light) !important; color: var(--x6-brand) !important; }
.x6-composer-send { background: var(--x6-brand) !important; }
.x6-composer-send:hover { background: var(--x6-brand-hover) !important; }
.x6-model-sel-select { border-color: var(--x6-border); color: var(--x6-text-secondary); font-size: 12px; padding: 2px 6px; border-radius: 4px; background: var(--x6-surface-2); }
</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<aside class="x6-sidebar" id="sidebar">
  <!-- Brand -->
  <div class="x6-sidebar-brand">
    <div class="x6-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--x6-brand)" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="var(--x6-brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="x6-logo-text">小6</span>
    </div>
    <button class="x6-new-task-btn" id="newTaskBtn" title="新任务">＋ 新任务</button>
  </div>

  <!-- Nav -->
  <nav class="x6-sidebar-nav">
    <button class="x6-nav-btn is-active" data-nav="home">💬 新对话</button>
    <button class="x6-nav-btn" data-nav="timer">⏰ 定时任务</button>
    <button class="x6-nav-btn" data-nav="plugins">🔌 插件</button>
  </nav>

  <!-- Projects -->
  <div class="x6-sidebar-section">
    <div class="x6-section-header">
      <span>项目</span>
      <span class="x6-section-count" id="projectCount">0</span>
    </div>
    <div class="x6-project-list" id="projectList">
      <div class="x6-project-empty">暂无项目</div>
    </div>
  </div>

  <!-- History -->
  <div class="x6-sidebar-section">
    <div class="x6-section-header">
      <span>最近对话</span>
    </div>
    <div class="x6-history-list" id="historyList">
      <div class="x6-history-empty">暂无对话</div>
    </div>
  </div>

  <!-- User -->
  <div class="x6-sidebar-footer">
    <div class="x6-user-info">
      <div class="x6-avatar">6</div>
      <div class="x6-user-meta">
        <div class="x6-username">用户</div>
        <div class="x6-plan">免费版</div>
      </div>
    </div>
    <button class="x6-settings-btn" title="设置">⚙</button>
  </div>
</aside>

<!-- ═══ Shell (main area) ═══ -->
<div class="x6-shell" id="shell">
  <!-- Top bar -->
  <header class="x6-topbar">
    <div class="x6-topbar-left">
      <span class="x6-topbar-title" id="topbarTitle">小6</span>
      <span class="x6-topbar-subtitle" id="topbarSubtitle">有什么我可以帮你？</span>
    </div>
    <div class="x6-topbar-right">
      <div class="x6-model-sel" id="modelSelWrap">
        <select class="x6-model-sel-select" id="modelSel">
          <option value="agnes-2.5-flash">Agnes 2.5 Flash</option>
          <option value="deepseek-r1-671b">DeepSeek R1 671B</option>
        </select>
      </div>
      <div class="x6-status-dot-wrap" id="runtimeState" data-mode="online">
        <span class="x6-status-dot"></span>
        <span class="x6-status-text">在线</span>
      </div>
    </div>
  </header>

  <!-- Views -->
  <main class="x6-main">
    <!-- HOME view -->
    <section class="x6-view x6-view-home" data-view="home">
      <!-- Hero -->
      <div class="x6-hero" id="hero">
        <div class="x6-hero-inner">
          <h1 class="x6-hero-title">你好，<span class="x6-hero-name">614415</span></h1>
          <p class="x6-hero-sub">我能为你做什么？</p>

          <!-- Composer: AgnesCode style -->
          <div class="x6-composer-wrap" id="composerWrap">
            <div class="x6-composer-hint">
              <span>@ 引用文件 &nbsp;·&nbsp; / 调用指令 &nbsp;·&nbsp; $ 调用技能</span>
            </div>
            <textarea class="x6-composer-input" id="cmdInput" rows="1" placeholder="给小6一个任务……"></textarea>
            <div class="x6-composer-bar">
              <div class="x6-composer-left">
                <button class="x6-composer-attach" title="附件">📎</button>
                <button class="x6-composer-mode" id="modeSel">智能模式 ▾</button>
              </div>
              <div class="x6-composer-right">
                <button class="x6-composer-voice" id="voiceBtn" title="语音输入">🎤</button>
                <button class="x6-composer-send" id="sendBtn" title="发送">↑</button>
              </div>
            </div>
          </div>

          <!-- Quick actions -->
          <div class="x6-quick-actions">
            <div class="x6-quick-label">快速开始</div>
            <div class="x6-quick-grid">
              <button class="x6-quick-card" data-prompt="帮我检查这个项目"><span>🔍</span>检查项目</button>
              <button class="x6-quick-card" data-prompt="帮我写一个工具"><span>⚡</span>开发工具</button>
              <button class="x6-quick-card" data-prompt="帮我分析一下代码"><span>📊</span>分析代码</button>
              <button class="x6-quick-card" data-prompt="帮我生成一个网页"><span>🌐</span>制作网页</button>
            </div>
          </div>

          <!-- Timeline (compact) -->
          <div class="x6-timeline-section" id="timelineSection" style="display:none">
            <div class="x6-timeline-header">
              <span>执行过程</span>
              <button class="x6-timeline-toggle" id="inspTrigger">展开详情 ▸</button>
            </div>
            <div class="x6-timeline-body" id="timelineBody"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- TIMER view -->
    <section class="x6-view" data-view="timer" hidden>
      <div class="x6-empty-state">
        <div class="x6-empty-icon">⏰</div>
        <div class="x6-empty-title">定时任务</div>
        <div class="x6-empty-desc">暂未配置定时任务</div>
      </div>
    </section>

    <!-- PLUGINS view -->
    <section class="x6-view" data-view="plugins" hidden>
      <div class="x6-empty-state">
        <div class="x6-empty-icon">🔌</div>
        <div class="x6-empty-title">插件市场</div>
        <div class="x6-empty-desc">暂未安装插件</div>
      </div>
    </section>

    <!-- HISTORY view -->
    <section class="x6-view" data-view="history" hidden>
      <div class="x6-history-page" id="historyPage"></div>
    </section>
  </main>

  <!-- Now bar (bottom of main) -->
  <div class="x6-nowbar" id="nowBar" data-state="idle">
    <div class="x6-nowbar-content">
      <span class="x6-nowbar-dot" id="nowDot"></span>
      <span class="x6-nowbar-text" id="nowText">小6在线</span>
    </div>
  </div>
</div>

<!-- ═══ Drawer (inspector) ═══ -->
<div class="x6-drawer-backdrop" id="drawerScrim" aria-hidden="true"></div>
<aside class="x6-drawer" id="drawer" aria-hidden="true">
  <div class="x6-drawer-header">
    <span class="x6-drawer-title" id="drawerTitle">详情</span>
    <button class="x6-drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="x6-drawer-body" id="drawerBody"></div>
</aside>

<!-- ═══ Command Palette ═══ -->
<div class="x6-palette-backdrop" id="paletteScrim" aria-hidden="true"></div>
<div class="x6-palette" id="palette" aria-hidden="true">
  <div class="x6-palette-input-wrap">
    <span class="x6-palette-icon">🔍</span>
    <input class="x6-palette-input" id="paletteInput" placeholder="搜索命令或对话……" autocomplete="off" />
  </div>
  <div class="x6-palette-list" id="paletteList"></div>
</div>

<!-- ═══ Overlay (modal) ═══ -->
<div class="x6-overlay" id="overlay" aria-hidden="true">
  <div class="x6-overlay-card">
    <div class="x6-overlay-header">
      <span class="x6-overlay-title" id="overlayTitle">提示</span>
      <button class="x6-overlay-close" onclick="window.Xiao6&&window.Xiao6.main&&window.Xiao6.main.closeOverlay()">✕</button>
    </div>
    <div class="x6-overlay-body" id="overlayBody"></div>
  </div>
</div>

<!-- ═══ Toasts ═══ -->
<div class="x6-toast-layer" id="toastLayer"></div>

<!-- ═══ Voice orb (fixed, bottom-right) ═══ -->
<div class="x6-voice-orb" id="orbBtn">
  <div class="x6-orb-presence" id="orbPresence" data-state="idle"></div>
  <div class="x6-mini-orb" data-state="idle"></div>
</div>

<!-- ═══ Scripts ═══ -->
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/timeline.js"></script>
<script src="js/approval.js"></script>
<script src="js/voice.js"></script>
<script src="js/palette.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/inspector.js"></script>
<script src="js/main.js"></script>
</body>
</html>
