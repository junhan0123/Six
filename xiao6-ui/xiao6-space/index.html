<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小6 · Advanced Workspace</title>
<meta name="description" content="小6 Advanced Workspace — 高级 AI 工作台（UI-R1 三栏壳）" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2322d3ee' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23a78bfa'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/tokens.css?v=37" />
<link rel="stylesheet" href="css/layout.css?v=37" />
<link rel="stylesheet" href="css/components.css?v=37" />
<link rel="stylesheet" href="css/sidebar.css?v=37" />
<link rel="stylesheet" href="css/workspace.css?v=37" />
<link rel="stylesheet" href="css/panel.css?v=37" />
</head>
<body data-view="conversation">

<!-- ═══════════════ TITLEBAR ═══════════════ -->
<header class="xiao6-top">
  <div class="xiao6-top-left">
    <span class="xiao6-brand-orb" aria-hidden="true"></span>
    <span class="xiao6-brand">小6</span>
    <span class="xiao6-brand-sub">Advanced Workspace</span>
  </div>
  <div class="xiao6-top-center">
    <button class="xiao6-cmdk" id="cmdkBtn" type="button" aria-label="命令面板">
      <span class="xiao6-cmdk-ic">⌘</span>
      <span class="xiao6-cmdk-text">告诉小6要做什么…</span>
      <span class="xiao6-cmdk-kbd">Ctrl K</span>
    </button>
  </div>
  <div class="xiao6-top-right">
    <span class="xiao6-runtime" id="runtimeState" data-mode="online" title="运行时状态">
      <i class="xiao6-dot"></i><b>在线待命</b>
    </span>
    <span class="xiao6-ctx-chip" id="ctxChip" hidden></span>
    <button class="xiao6-icon-btn" id="orbBtn" type="button" aria-label="语音球" title="语音球（小6的存在感）">
      <span class="xiao6-mini-orb" data-state="idle"></span>
    </button>
  </div>
</header>

<!-- ═══════════════ SHELL（三栏）═══════════════ -->
<div class="xiao6-shell">

  <!-- LEFT：Workspace Sidebar -->
  <aside class="xiao6-sidebar" id="xiao6Sidebar" aria-label="工作区侧栏">
    <div class="xiao6-sidebar-brand">
      <span class="xiao6-brand-orb" aria-hidden="true"></span>
      <span class="xiao6-brand">小6</span>
    </div>
    <div class="xiao6-sidebar-scroll">
      <div class="xiao6-sidebar-group">
        <div class="xiao6-sidebar-label">Workspace</div>
        <button class="xiao6-nav-btn" data-nav="projects" type="button">
          <svg viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
          <span>项目</span>
        </button>
        <button class="xiao6-nav-btn" data-nav="tasks" type="button">
          <svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11"/><path d="m4 5 1 1 2-2"/><path d="m4 12 1 1 2-2"/><path d="m4 19 1 1 2-2"/></svg>
          <span>任务</span>
        </button>
      </div>
      <div class="xiao6-sidebar-group">
        <div class="xiao6-sidebar-label">Memory</div>
        <button class="xiao6-nav-btn" data-nav="memory" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7z"/><path d="M9 22h6"/></svg>
          <span>记忆</span>
        </button>
        <button class="xiao6-nav-btn" data-nav="knowledge" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h7v18H6a2 2 0 0 1-2-2z"/><path d="M20 5a2 2 0 0 0-2-2h-3v18h3a2 2 0 0 0 2-2"/></svg>
          <span>知识</span>
        </button>
      </div>
      <div class="xiao6-sidebar-group">
        <div class="xiao6-sidebar-label">Capability</div>
        <button class="xiao6-nav-btn" data-nav="capabilities" type="button">
          <svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.1 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
          <span>技能</span>
        </button>
        <button class="xiao6-nav-btn" data-nav="tools" type="button">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4z"/></svg>
          <span>工具</span>
        </button>
      </div>
    </div>
    <div class="xiao6-sidebar-foot">
      <div class="xiao6-sidebar-label">System</div>
      <button class="xiao6-nav-btn" data-nav="settings" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </div>
  </aside>

  <!-- CENTER：Agent Workspace（Timeline） -->
  <main class="xiao6-center" id="xiao6Center">
    <section class="xiao6-view xiao6-conv" data-view="conversation">
      <div class="xiao6-conv-head">
        <div class="xiao6-conv-tabs">
          <button class="xiao6-tab is-active" data-tab="conversation" type="button">对话</button>
          <button class="xiao6-tab" data-tab="workspace" type="button">工作区</button>
          <button class="xiao6-tab" data-tab="results" type="button">结果</button>
          <button class="xiao6-tab" data-tab="agent" type="button">Agent 活动</button>
        </div>
        <div class="xiao6-conv-tools">
          <button class="xiao6-tool xiao6-model-btn" id="modelBtn" type="button" title="模型">
            <span class="xiao6-model-dot"></span><span id="modelLabel">模型</span><span class="xiao6-caret">▾</span>
            <div class="xiao6-model-pop" id="modelPop" hidden></div>
          </button>
          <button class="xiao6-tool xiao6-perm-btn" id="permBtn" type="button" title="权限">
            <span id="permLabel">手动确认</span>
            <div class="xiao6-perm-pop" id="permPop" hidden></div>
          </button>
          <button class="xiao6-tool" data-tool="think" type="button" title="深度思考">思考</button>
          <button class="xiao6-tool" data-tool="web" type="button" title="联网搜索">联网</button>
          <button class="xiao6-tool" data-tool="voice" type="button" title="语音输入">🎙</button>
          <button class="xiao6-tool is-on" data-tool="speak" type="button" title="语音播报">🔊</button>
        </div>
      </div>

      <!-- timeline body：对话 -->
      <div class="xiao6-conv-body" id="convBody" data-tab="conversation">
        <div class="xiao6-chat" id="chatList"></div>
        <div class="xiao6-input-row">
          <div class="xiao6-trigger-hint" id="triggerHint" hidden></div>
          <form class="xiao6-cmd-form" id="cmdForm" autocomplete="off">
            <span class="xiao6-input-prefix">›</span>
            <input class="xiao6-cmd-input" id="cmdInput" type="text" placeholder="对小6说点什么，或输入 / 唤起命令…" autocomplete="off" spellcheck="false" aria-label="指令输入" />
            <button class="xiao6-send" type="submit" aria-label="发送">发送</button>
          </form>
        </div>
      </div>

      <!-- timeline body：工作区 -->
      <div class="xiao6-ws-body" id="wsBody" data-tab="workspace" hidden>
        <div class="xiao6-ws-empty" id="wsEmpty"><span class="xiao6-empty">没有进行中的工作区任务 · 让小6帮你完成一件事</span></div>
        <div class="xiao6-ws-list" id="wsList"></div>
      </div>

      <!-- timeline body：结果 -->
      <div class="xiao6-results-body" id="resBody" data-tab="results" hidden>
        <div class="xiao6-results-list" id="resList"><span class="xiao6-empty">暂无结果</span></div>
      </div>

      <!-- timeline body：Agent 活动 -->
      <div class="xiao6-agent-body" id="agentBody" data-tab="agent" hidden>
        <div class="xiao6-agent-list" id="agentList"><span class="xiao6-empty">暂无 Agent 活动</span></div>
      </div>

      <!-- 右侧消息跳转条（minimap / scroll-spy） -->
      <div class="xiao6-jumpbar" id="jumpbar" hidden>
        <div class="xiao6-jump-track" id="jumpTrack"></div>
      </div>
    </section>

    <!-- 列表视图（sidebar.js 渲染） -->
    <section class="xiao6-view xiao6-list-view" data-view="projects" hidden>
      <div class="xiao6-view-head"><h2>项目</h2><p>目标与进行中的工作</p></div>
      <div class="xiao6-list" id="projectsList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="tasks" hidden>
      <div class="xiao6-view-head"><h2>任务</h2><p>待办与执行中</p></div>
      <div class="xiao6-list" id="tasksList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="memory" hidden>
      <div class="xiao6-view-head"><h2>记忆</h2><p>小6记住的关于你的一切</p></div>
      <div class="xiao6-list" id="memoryList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="knowledge" hidden>
      <div class="xiao6-view-head"><h2>知识</h2><p>结构化沉淀的知识库</p></div>
      <div class="xiao6-list" id="knowledgeList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="capabilities" hidden>
      <div class="xiao6-view-head"><h2>技能</h2><p>已登记并可被调用的能力</p></div>
      <div class="xiao6-list" id="capabilitiesList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="tools" hidden>
      <div class="xiao6-view-head"><h2>工具</h2><p>可用的工具清单</p></div>
      <div class="xiao6-list" id="toolsList"></div>
    </section>
    <section class="xiao6-view xiao6-list-view" data-view="settings" hidden>
      <div class="xiao6-view-head"><h2>设置</h2><p>偏好与系统概览</p></div>
      <div class="xiao6-settings" id="settingsBody"></div>
    </section>
  </main>

  <!-- RIGHT：Agent Panel -->
  <aside class="xiao6-agent-panel" id="xiao6AgentPanel" aria-label="Agent 面板">
    <div class="xiao6-context-head">
      <span id="ctxTitle">上下文</span>
      <button class="xiao6-context-close" id="ctxClose" type="button" aria-label="收起">×</button>
    </div>
    <div class="xiao6-context-body" id="ctxBody"></div>
  </aside>
</div>

<!-- ═══════════════ VOICE ORB PRESENCE ═══════════════ -->
<div class="xiao6-orb-presence" id="orbPresence" data-state="idle" title="小6语音球">
  <span class="xiao6-orb-core"></span>
  <span class="xiao6-orb-ring"></span>
</div>

<!-- ═══════════════ COMMAND PALETTE ═══════════════ -->
<div class="xiao6-palette" id="palette" aria-hidden="true">
  <div class="xiao6-palette-scrim" id="paletteScrim"></div>
  <div class="xiao6-palette-sheet" role="dialog" aria-modal="true" aria-label="命令面板">
    <div class="xiao6-palette-input-row">
      <span class="xiao6-palette-ic">⌘</span>
      <input class="xiao6-palette-input" id="paletteInput" type="text" placeholder="搜索命令或告诉小6要做什么…" autocomplete="off" />
    </div>
    <div class="xiao6-palette-list" id="paletteList"></div>
  </div>
</div>

<!-- ═══════════════ OVERLAY（detail / approval / settings / 表单）═══════════════ -->
<div class="xiao6-overlay" id="overlay" aria-hidden="true">
  <div class="xiao6-overlay-scrim" id="overlayScrim"></div>
  <section class="xiao6-overlay-sheet" role="dialog" aria-modal="true">
    <div class="xiao6-overlay-head">
      <span class="xiao6-overlay-title" id="overlayTitle">面板</span>
      <span class="xiao6-overlay-hint" id="overlayHint"></span>
      <button class="xiao6-overlay-close" id="overlayClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="xiao6-overlay-body" id="overlayBody"></div>
  </section>
</div>

<!-- ═══════════════ TOAST / BANNER ═══════════════ -->
<div class="xiao6-toast-layer" id="toastLayer" aria-live="polite"></div>
<div class="xiao6-banner" id="banner" hidden></div>

<script src="js/api.js?v=37"></script>
<script src="js/state.js?v=37"></script>
<script src="js/voice.js?v=37"></script>
<script src="js/approval.js?v=37"></script>
<script src="js/timeline.js?v=37"></script>
<script src="js/sidebar.js?v=37"></script>
<script src="js/palette.js?v=37"></script>
<script src="js/agent-panel.js?v=37"></script>
<script src="js/main.js?v=37"></script>
</body>
</html>
