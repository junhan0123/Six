<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- Xiao6 localStorage migration fallback: preserves settings from old Xiao6 keys -->
<script>
(function(){
  try {
    var map = {
      'xiao6_sid':'xiao6_sid','xiao6_settings_v1':'xiao6_settings_v1','xiao6_history_v1':'xiao6_history_v1',
      'xiao6_briefing_date':'xiao6_briefing_date','xiao6_config_overrides':'xiao6_config_overrides','xiao6_user_name':'xiao6_user_name',
      'xiao6_onboarded':'xiao6_onboarded','xiao6_autoSpeak':'xiao6_autoSpeak','xiao6_toolmodes':'xiao6_toolmodes','xiao6_aiName':'xiao6_aiName'
    };
    for (var oldK in map) {
      var newK = map[oldK];
      if (localStorage.getItem(newK) === null) {
        var v = localStorage.getItem(oldK);
        if (v !== null) localStorage.setItem(newK, v);
      }
    }
  } catch(e){}
})();
</script>

<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>小6 · 语音球</title>
<style>
  /* 纯点云能量球：窗口贴合球体，无边框、无背景、无状态文字 */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #orb-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: grab;
  }
  #orb-canvas.dragging { cursor: grabbing; }

  /* ── 执行过程对话框（蓝色任务框，球右侧滑入） ── */
  .orb-exec-dialog {
    position: fixed;
    right: 12px; top: 50%;
    transform: translate(120%, -50%);
    width: 320px;
    max-height: 92vh;
    overflow-y: auto;
    background: linear-gradient(165deg, rgba(16, 40, 84, 0.97), rgba(8, 20, 48, 0.97));
    border: 1px solid rgba(70, 150, 255, 0.45);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 32px rgba(60, 140, 255, 0.15);
    padding: 15px 17px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dcebff;
  }
  .orb-exec-dialog.show { transform: translate(0, -50%); }
  .orb-exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .orb-exec-title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; color: #7db8ff; }
  .orb-exec-close {
    margin-left: auto; cursor: pointer; color: #7f9cc9;
    font-size: 15px; padding: 2px 6px; border-radius: 5px;
  }
  .orb-exec-close:hover { color: #fff; background: rgba(120,180,255,0.15); }
  .orb-exec-user {
    font-size: 12.5px; color: #b8d0ee;
    background: rgba(70, 150, 255, 0.12);
    border-left: 3px solid #4a9bff;
    padding: 8px 11px; border-radius: 8px;
    margin-bottom: 12px; word-break: break-word;
  }
  .orb-exec-steps { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .orb-exec-step {
    font-size: 12.5px; color: #cfe2ff;
    padding: 7px 10px; border-radius: 8px;
    background: rgba(60, 130, 255, 0.14);
    border: 1px solid rgba(80, 155, 255, 0.2);
    animation: step-pulse 1.4s ease-in-out infinite;
  }
  @keyframes step-pulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }
  .orb-exec-reply {
    font-size: 12.5px; color: #e6f0ff;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    border-top: 1px solid rgba(90, 160, 255, 0.2);
    padding-top: 9px; margin-top: 5px;
    display: none;
  }
  .orb-exec-dialog.has-reply .orb-exec-reply { display: block; }

  /* ── 完成对话框（右下） ── */
  .orb-done-dialog {
    position: fixed;
    right: 12px; bottom: 14px;
    width: 320px;
    background: linear-gradient(160deg, rgba(20, 34, 40, 0.97), rgba(14, 20, 34, 0.97));
    border-radius: 16px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6);
    padding: 14px 16px;
    z-index: 999;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2f5ec;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .orb-done-dialog.show { opacity: 1; transform: translateY(0); }
  .orb-done-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .orb-done-icon { font-size: 16px; }
  .orb-done-title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #96f0bb; }
  .orb-done-close {
    margin-left: auto; cursor: pointer; color: #93b8a6;
    font-size: 15px; padding: 2px 6px; border-radius: 5px;
  }
  .orb-done-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .orb-done-user { font-size: 12px; color: #a9c8b8; margin-bottom: 8px; word-break: break-word; }
  .orb-done-divider { height: 1px; background: rgba(130, 255, 180, 0.16); margin-bottom: 8px; }
  .orb-done-reply-label { font-size: 10.5px; color: #7fc9a0; letter-spacing: 1px; margin-bottom: 4px; }
  .orb-done-reply {
    font-size: 13px; color: #ecfbf2;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    /* 内容完整展示，不截断 */
  }
</style>
</head>
<body>
  <canvas id="orb-canvas"></canvas>

  <script src="/desktop-avatar/dyna-orb.js"></script>
  <!-- 兜底：无论 voice 脚本是否加载/报错，能量球都先无条件渲染，保证桌面窗口可见 -->
  <script>
  (function () {
    'use strict';
    try {
      var _c = document.getElementById('orb-canvas');
      var _o = window.ZZDynaOrb;
      if (_o && _c) { _o.init(_c); _o.start(); _o.setState('idle'); }
    } catch (e) { /* 渲染兜底失败也不影响窗口显示 */ }
  })();
  </script>
  <script src="/desktop-avatar/dyna-orb-voice.js"></script>
  <script>
  /* 窗口交互：球体可长按拖动，球外透明区穿透（窗口贴合球体） */
  (function () {
    'use strict';
    var canvas = document.getElementById('orb-canvas');
    var api = window.electronAPI;
    if (!canvas || !api) return;

    var dragging = false;
    var pending = { dx: 0, dy: 0, scheduled: false };

    function isOnBall(e) {
      var r = canvas.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height / 2);
      return dx * dx + dy * dy <= (r.width / 2) * (r.width / 2);
    }

    function setIgnore(ignore) {
      try { api.setIgnoreMouse(ignore); } catch (_) {}
    }

    // 非拖动状态：球内可交互（grab），球外穿透
    function hover(e) {
      if (dragging) return;
      var on = isOnBall(e);
      canvas.style.cursor = on ? 'grab' : 'default';
      setIgnore(!on);
    }
    canvas.addEventListener('pointermove', hover);
    canvas.addEventListener('pointerleave', function () { if (!dragging) setIgnore(true); });

    function flushMove() {
      pending.scheduled = false;
      if (!pending.dx && !pending.dy) return;
      if (api.moveWindow) {
        try { api.moveWindow(pending.dx, pending.dy); } catch (_) {}
      }
      pending.dx = 0;
      pending.dy = 0;
    }
    function scheduleMove() {
      if (pending.scheduled) return;
      pending.scheduled = true;
      requestAnimationFrame(flushMove);
    }

    // 左键长按球体即可拖动（Pointer Events + 指针捕获，移出窗口也不丢事件）
    canvas.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || dragging) return;
      if (!isOnBall(e)) return;
      dragging = true;
      pending.dx = 0; pending.dy = 0;
      canvas.classList.add('dragging');
      setIgnore(false); // 锁定为可交互，拖动期间不再切穿透
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });

    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      // movementX/Y 是浏览器算好的连续增量，比 screen 差更稳；
      // 用 rAF 批量发送，避免高频率 IPC 导致主进程/渲染抖动。
      pending.dx += e.movementX || 0;
      pending.dy += e.movementY || 0;
      scheduleMove();
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      flushMove();
      canvas.classList.remove('dragging');
      try { if (e && e.pointerId != null) canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      if (e) hover(e); else setIgnore(true);
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  })();
  </script>
</body>
</html>
