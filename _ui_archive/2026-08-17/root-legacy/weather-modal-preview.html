<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天气弹窗预览 · 小6</title>
<style>
  :root{
    --panel:rgba(13,20,28,.62); --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.18);
    --text:#eaf2f8; --dim:#8B98A9; --dim2:#5C6B7A; --accent:#2DD4BF; --amber:#F5B14C; --glow:0 0 40px rgba(45,212,191,.12);
  }
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:radial-gradient(1200px 800px at 70% -10%,#16263a 0%,#0a0f16 60%);font-family:'Rajdhani',system-ui,sans-serif;color:var(--text)}
  .modal-mask{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    background:rgba(4,8,14,.55);backdrop-filter:blur(6px) saturate(120%);}
  .modal-card{position:relative;width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:24px;padding:26px 26px 20px;backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 30px 80px rgba(0,0,0,.5),var(--glow);}
  .modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;
    border:1px solid var(--line);background:transparent;color:var(--dim);font-size:16px;cursor:pointer;display:grid;place-items:center}
  .wx-modal-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wx-city{font-weight:700;font-size:28px;line-height:1}
  .wx-resolved{font-size:12px;color:var(--dim2);font-family:'Share Tech Mono',monospace}
  .wx-now{display:flex;align-items:center;gap:18px;margin:18px 0 6px}
  .wx-emoji{font-size:64px;line-height:1}
  .wx-temp{font-weight:700;font-size:64px;line-height:.9}
  .wx-temp sup{font-size:24px;top:-1.4em;color:var(--dim)}
  .wx-cond{font-size:18px;font-weight:600}
  .wx-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:13px;color:var(--dim)}
  .wx-day{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:13px;color:var(--dim);
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .wx-day .hi{color:var(--amber);font-weight:700} .wx-day .lo{color:var(--dim)}
  .wx-hourly{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px}
  .wx-hb{flex:0 0 auto;width:58px;text-align:center;background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:14px;padding:10px 4px}
  .wx-hb .t{font-size:10px;color:var(--dim2);font-family:'Share Tech Mono',monospace}
  .wx-hb .e{font-size:22px;margin:4px 0} .wx-hb .d{font-size:14px;font-weight:700}
  .wx-foot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .wx-speak{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:9px 16px;font-size:14px;cursor:pointer}
  .wx-foot .hint{font-size:11px;color:var(--dim2);margin-left:auto;font-family:'Share Tech Mono',monospace}
</style>
</head>
<body>
  <div class="modal-mask show">
    <div class="modal-card">
      <div class="modal-close">×</div>
      <div class="wx-modal-head">
        <span class="wx-city">北京</span>
        <span class="wx-resolved">北京，北京市，中国</span>
      </div>
      <div class="wx-now">
        <div class="wx-emoji">☀️</div>
        <div>
          <div class="wx-temp">33<sup>°C</sup></div>
          <div class="wx-cond">晴</div>
        </div>
      </div>
      <div class="wx-meta"><span>体感 36°</span><span>湿度 55%</span><span>风速 9.9 km/h</span></div>
      <div class="wx-day">今日 <span class="hi">↑ 33°</span> <span class="lo">↓ 25°</span></div>
      <div class="wx-hourly">
        <div class="wx-hb"><div class="t">16:00</div><div class="e">☀️</div><div class="d">33°</div></div>
        <div class="wx-hb"><div class="t">17:00</div><div class="e"><svg class="zz-icon stroke" aria-hidden="true"><use href="#zz-weather"/></svg></div><div class="d">32°</div></div>
        <div class="wx-hb"><div class="t">18:00</div><div class="e">⛅</div><div class="d">30°</div></div>
        <div class="wx-hb"><div class="t">19:00</div><div class="e">☁️</div><div class="d">28°</div></div>
        <div class="wx-hb"><div class="t">20:00</div><div class="e">☁️</div><div class="d">27°</div></div>
        <div class="wx-hb"><div class="t">21:00</div><div class="e">🌙</div><div class="d">26°</div></div>
      </div>
      <div class="wx-foot">
        <button class="wx-speak"><svg class="zz-icon stroke" aria-hidden="true"><use href="#zz-volume"/></svg> 朗读天气</button>
        <span class="hint">Esc / 点遮罩关闭</span>
      </div>
    </div>
  </div>
</body>
</html>
