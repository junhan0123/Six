<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>小6 · 移动伴随端</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#0b0f14; --glass:rgba(255,255,255,0.05); --glass-bd:rgba(255,255,255,0.12);
      --cyan:#22D3EE; --teal:#2DD4BF; --amber:#F5B544; --txt:#e8eef5; --muted:#8aa0b4;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
    body{min-height:100vh;display:flex;flex-direction:column;
      background:radial-gradient(120% 80% at 50% -10%, rgba(34,211,238,0.12), transparent 60%), var(--bg);}
    .app-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;}
    .brand{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
    .brand-sub{font-size:12px;color:var(--muted);}
    .badge{margin-left:auto;font-size:11px;color:var(--teal);border:1px solid rgba(45,212,191,0.4);border-radius:999px;padding:3px 10px;}
    .panels{flex:1;padding:8px 14px 90px;overflow-y:auto;}
    .panel h2{font-size:15px;margin:6px 0 12px;color:var(--txt);font-weight:600;}
    .card,.list li{background:var(--glass);border:1px solid var(--glass-bd);border-radius:16px;backdrop-filter:blur(20px);}
    #briefing-body{padding:16px;line-height:1.6;}
    .greeting{font-size:16px;font-weight:600;margin:0 0 8px;}
    .weather{color:var(--amber);margin:0 0 12px;font-size:14px;}
    .list{list-style:none;margin:8px 0 0;padding:0;}
    .list li{padding:12px 14px;margin-bottom:8px;font-size:14px;}
    .muted{color:var(--muted);font-size:13px;}
    .row{display:flex;gap:8px;margin-bottom:12px;}
    .row input{flex:1;background:var(--glass);border:1px solid var(--glass-bd);border-radius:12px;color:var(--txt);padding:12px;font-size:15px;outline:none;}
    .btn{background:linear-gradient(90deg,var(--cyan),var(--teal));color:#03212a;border:none;border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;}
    .chat-log{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:50vh;overflow-y:auto;}
    .bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;}
    .bubble.mine{align-self:flex-end;background:linear-gradient(90deg,var(--cyan),var(--teal));color:#03212a;}
    .bubble.sys{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-bd);color:var(--muted);}
    .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,15,20,0.85);backdrop-filter:blur(24px);border-top:1px solid var(--glass-bd);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);}
    .tab{flex:1;background:none;border:none;color:var(--muted);font-size:13px;padding:8px 0;border-radius:12px;}
    .tab.active{color:var(--cyan);background:rgba(34,211,238,0.12);}
    .banner{position:fixed;top:0;left:0;right:0;background:rgba(245,181,68,0.15);border-bottom:1px solid rgba(245,181,68,0.4);color:var(--amber);font-size:12px;padding:8px 14px;text-align:center;z-index:20;}
    .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(45,212,191,0.9);color:#03212a;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;}
    .hidden{display:none !important;}
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <div class="brand">小6</div>
      <div class="brand-sub">移动伴随端</div>
    </div>
    <span id="sync-badge" class="badge hidden">桌面在线</span>
  </header>

  <main class="panels">
    <section id="panel-briefing" class="panel">
      <h2>今日简报</h2>
      <div id="briefing-body" class="card">加载中…</div>
    </section>

    <section id="panel-reminder" class="panel hidden">
      <h2>提醒</h2>
      <form id="reminder-form" class="row">
        <input id="reminder-input" type="text" placeholder="写一条提醒…" autocomplete="off" />
        <button type="submit" class="btn">添加</button>
      </form>
      <ul id="reminder-list" class="list"></ul>
    </section>

    <section id="panel-chat" class="panel hidden">
      <h2>快捷对话</h2>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="row">
        <input id="chat-input" type="text" placeholder="对小6说点什么…" autocomplete="off" />
        <button type="submit" class="btn">发送</button>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-target="briefing">简报</button>
    <button class="tab" data-target="reminder">提醒</button>
    <button class="tab" data-target="chat">对话</button>
  </nav>

  <div id="banner" class="banner hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- 复用设备自注册（多端同步基础） -->
  <script src="device-client.js"></script>
  <script src="mobile-app.js?v=20260806t1"></script>
</body>
</html>
